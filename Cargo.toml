[workspace]
resolver = "2"
members = ["crates/kitlib", "crates/partscript", "crates/partscript-cli", "crates/partscript-wasm", "crates/site"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/meowers-dev/partscript"
homepage = "https://partscript.dev"

[profile.release]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
