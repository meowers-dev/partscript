[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "partscript"
version = "0.1.0.dev0"
description = "Low-poly props in a few words: a small language that compiles to .glb, no Blender needed."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
keywords = ["3d", "low-poly", "psx", "gltf", "procedural", "game-assets"]

[project.urls]
Homepage = "https://partscript.dev"
Repository = "https://github.com/meowers-dev/partscript"

[project.scripts]
partscript = "partscript.cli:main"

[dependency-groups]
dev = [
    "markdown>=3.10.3",
    "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/partscript", "src/kitlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 160
indent-width = 4

[tool.ruff.format]
indent-style = "tab"
